<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>모아두기</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- 로그인 화면 -->
  <section id="auth" class="auth hidden">
    <form id="auth-form" class="card">
      <h1>모아두기</h1>
      <p class="muted">글, 사진, 영상, 음악을 주제별로 한곳에.</p>
      <input id="email" type="email" placeholder="이메일" required autocomplete="email" />
      <input id="password" type="password" placeholder="비밀번호 (6자 이상)" required minlength="6" autocomplete="current-password" />
      <div class="row">
        <button type="submit" data-mode="signin">로그인</button>
        <button type="submit" data-mode="signup" class="ghost">회원가입</button>
      </div>
      <p id="auth-msg" class="muted small"></p>
    </form>
  </section>

  <!-- 메인 화면 -->
  <section id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">모아두기</div>
      <button id="new-folder" class="ghost small-btn">+ 새 폴더</button>
      <nav id="tree"></nav>
      <div class="sidebar-foot">
        <button id="open-settings" class="profile-btn" title="계정 설정">
          <span class="avatar" id="side-avatar"></span>
          <span id="side-name" class="small"></span>
        </button>
        <button id="signout" class="ghost small-btn">로그아웃</button>
      </div>
    </aside>

    <main class="main">
      <!-- 계정 설정 -->
      <div id="settings" class="settings hidden">
        <header class="topbar"><div class="crumbs">계정 설정</div>
          <button id="close-settings" class="ghost">← 보관함으로</button></header>

        <section class="panel">
          <h2>프로필 사진</h2>
          <div class="row">
            <span class="avatar avatar-lg" id="set-avatar"></span>
            <div class="row wrap">
              <label class="btn">사진 변경
                <input id="avatar-input" type="file" accept="image/jpeg,image/png,image/webp" hidden />
              </label>
              <button id="avatar-remove" class="ghost">사진 삭제</button>
            </div>
          </div>
        </section>

        <section class="panel">
          <h2>이름</h2>
          <form id="name-form" class="row">
            <input id="name-input" maxlength="30" placeholder="표시할 이름" />
            <button type="submit">저장</button>
          </form>
          <p class="muted small">이메일: <span id="set-email"></span></p>
        </section>

        <section class="panel danger">
          <h2>계정 삭제</h2>
          <p class="small">계정과 저장한 모든 글·사진·영상·폴더가 영구적으로 삭제되며 되돌릴 수 없어요.</p>
          <form id="delete-form" class="row">
            <input id="delete-confirm" placeholder="확인을 위해 '삭제'를 입력" />
            <button type="submit" class="danger-btn">계정 영구 삭제</button>
          </form>
        </section>
        <p id="settings-msg" class="muted small"></p>
      </div>

      <div id="library">
      <header class="topbar">
        <div id="crumbs" class="crumbs"></div>
        <div class="row">
          <span id="ai-status" class="muted small"></span>
          <button id="auto-classify" class="ghost" title="미분류 항목(폴더 화면에서는 그 폴더의 항목)을 AI가 주제별 폴더로 정리">✨ 자동 분류</button>
          <button id="add-note" class="ghost">글 쓰기</button>
          <button id="add-link" class="ghost">링크 저장</button>
          <label class="btn">파일 올리기
            <input id="file-input" type="file" multiple accept="image/*,video/*,audio/*,.pdf,.txt" hidden />
          </label>
        </div>
      </header>
      <div id="drop" class="drop">여기에 파일을 끌어다 놓으세요 · '전체'나 '미분류'에서 올리면 AI가 주제별 폴더로 자동 정리해요</div>
      <div id="grid" class="grid"></div>
      <p id="empty" class="muted center hidden">아직 저장된 항목이 없어요.</p>
      </div>
    </main>
  </section>

  <script type="module" src="/app.js"></script>
</body>
</html>
